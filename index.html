<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nacaroğlu Kebap ve Baklava – Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7ec;--surface:#ffffff;--ink:#1c2a16;--muted:#5d6b52;--green:#3b5a26;--gold:#b9800f;--line:#cfd8bd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b10;--surface:#1d2718;--ink:#eef3e4;--muted:#a3b293;--green:#9fcb74;--gold:#e5b44a;--line:#33422a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b10;--surface:#1d2718;--ink:#eef3e4;--muted:#a3b293;--green:#9fcb74;--gold:#e5b44a;--line:#33422a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
header{background:var(--green);color:#f4f7ec;padding:34px 20px 28px;text-align:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#24351a;color:#eef3e4}}
header h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:2rem;margin:0;line-height:1.1}
header p{margin:8px 0 0;font-size:1.05rem;opacity:.9}
main{max-width:640px;margin:0 auto;padding:8px 16px 40px}
section{margin-top:26px}
h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.5rem;margin:0 0 6px;color:var(--green)}
.note{margin:0 0 8px;color:var(--muted);font-size:.92rem}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
li{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li span:first-child{flex:1}
li .p{font-weight:700;white-space:nowrap;color:var(--gold)}
li .p.q{font-weight:500;color:var(--muted);font-size:.9rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.tile{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;padding:22px 14px;font-family:"Young Serif",Georgia,serif;font-size:1.2rem;cursor:pointer}
.tile:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.back{font:inherit;font-weight:700;background:none;border:0;color:var(--green);padding:14px 0 4px;cursor:pointer;font-size:1rem}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>
<header>
<h1>Nacaroğlu</h1>
<p>Kebap ve Baklava</p>
</header>
<main id="menu"></main>
<footer>Fiyatlar TL’dir.</footer>
<script>
var Q="Sorunuz";
var DATA=[
["Kebap",null,[["Tavuk Dürüm",120],["Tavuk Porsiyon",300],["Kıyma Dürüm",250],["Kıyma Porsiyon",500],["Kuşbaşı Dürüm",350],["Kuşbaşı Porsiyon",700],["Sucuk Dürüm",250],["Sucuk Porsiyon",500],["Lokum Dürüm",350],["Lokum Porsiyon",700]]],
["Çorba",null,[["Mercimek",100],["Az Mercimek",90],["Etli Mercimek",200],["İlikli Mercimek",120],["Beyran",330],["Az Beyran",250],["Et Paça",350],["Az Et Paça",250],["Ayak Paça",350],["Az Ayak Paça",250]]],
["Baklava",null,[["Kıvrım Baklava",1200],["Klasik Baklava",1800],["Kuru Baklava",1800],["Şöbiyet",2000],["Havuç Dilimi",2000],["Midye",2000],["Fıstık Sarma",2300],["Özel Kare",2000]]],
["Kahvaltı",null,[["Serpme Kahvaltı",450],["Kahvaltı Tabağı",250],["Sahanda Yumurta",180],["Kavurmalı Yumurta",260],["Sucuklu Yumurta",260],["Menemen",240],["Sucuklu Menemen",260],["Kavurmalı Menemen",260],["Kaşarlı Omlet",260]]],
["Katmer",null,[["Küçük",400],["Büyük",550],["Simit",650],["Burma",650]]],
["Gözleme",null,[["Kaşarlı",240],["Kasap Sucuklu",290],["Ayfon Sucuklu",240],["Kavurmalı",280],["Atom",290]]],
["Tost",null,[["Kaşarlı",240],["Ayfon Sucuklu",240],["Kasap Sucuklu",290],["Kavurmalı",290],["Atom",290]]],
["Sıcak İçecekler",null,[["Çay",20],["Türk Kahvesi",80],["Osmanlı Kahvesi",80],["Nescafe",80]]],
["Soğuk İçecekler",null,[["Su",15],["Ayran",30],["Soda",30],["Şalgam",40],["Kola / Fanta / Gazoz",70],["Meyve Suyu Çeşitleri",50],["Sıkma Portakal",150]]]
];
var menu=document.getElementById("menu"),views={};
function show(){var k=location.hash.slice(1);if(!views[k])k="";
  for(var n in views)views[n].className="view"+(n===k?" on":"");window.scrollTo(0,0)}
function render(D){
  menu.innerHTML="";views={};
  var home=document.createElement("div");home.className="view";
  var g=document.createElement("div");g.className="grid";home.appendChild(g);menu.appendChild(home);views[""]=home;
  D.forEach(function(c,i){
    var slug="k"+i,v=document.createElement("div");v.className="view";
    var bk=document.createElement("button");bk.className="back";bk.type="button";bk.textContent="‹ Menü";bk.onclick=function(){location.hash=""};
    var h=document.createElement("h2");h.textContent=c[0];
    var u=document.createElement("ul");
    c[2].forEach(function(it){
      var l=document.createElement("li"),a=document.createElement("span"),p=document.createElement("span");
      a.textContent=it[0];
      if(typeof it[1]==="number"){p.className="p";p.textContent=it[1]+" TL"}else{p.className="p q";p.textContent=it[1]}
      l.appendChild(a);l.appendChild(p);u.appendChild(l)});
    v.appendChild(bk);v.appendChild(h);v.appendChild(u);menu.appendChild(v);views[slug]=v;
    var t=document.createElement("button");t.className="tile";t.type="button";t.textContent=c[0];
    t.onclick=function(){location.hash=slug};g.appendChild(t)});
  show()}
function parseCSV(t){var rows=[],r=[],f="",q=false,i,ch;t=t.replace(/^\uFEFF/,"");
  for(i=0;i<t.length;i++){ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){r.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";rows.push(r);r=[]}
    else f+=ch}
  if(f!==""||r.length){r.push(f);rows.push(r)}return rows}
function fromCSV(t){var rows=parseCSV(t).slice(1),D=[],idx={};
  rows.forEach(function(r){var c=(r[0]||"").trim(),n=(r[1]||"").trim();if(!c||!n)return;
    var p=(r[2]||"").replace(/TL/i,"").replace(/\s/g,"");
    var val=/^\d+$/.test(p)?parseInt(p,10):(p===""?Q:p);
    if(!(c in idx)){idx[c]=D.length;D.push([c,null,[]])}
    D[idx[c]][2].push([n,val])});
  return D}
window.addEventListener("hashchange",show);
render(DATA);
var SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vTUsslf6Lw1a-YJ5t-AKY2VFlay1jNugTFU0z7k7A_q2kOQF4-6xL3NdK01SVGfg_0qfQ7IWLMiUbxv/pub?gid=41258251&single=true&output=csv";
function load(url){return fetch(url).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var D=fromCSV(t);if(!D.length)throw 0;return D})}
load(SHEET).catch(function(){return load("menu.csv?v="+Date.now())}).then(render).catch(function(){});
</script>
</body>
</html>
